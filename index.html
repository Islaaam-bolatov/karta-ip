  <title>Интерактивная карта ИП</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #f2f2f2;
    }

    #mapLayer {
      position: absolute;
      left: 0;
      top: 0;
      width: 2048px;
      height: 1356px; /* видимая часть карты, нижняя полоса скрыта */
      overflow: hidden;
      transform-origin: 0 0;
    }

    #mapImage {
      width: 2048px;
      height: 1448px;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .point {
      position: absolute;
      background: transparent;
      border: none;
      transform: translate(-50%, -50%);
      cursor: pointer;
      box-sizing: border-box;
      z-index: 10;
    }

    .point.circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .point.square {
      width: 34px;
      height: 34px;
      border-radius: 4px;
    }

    .point.circle:hover,
    .point.square:hover {
      background: rgba(255, 230, 0, 0.22);
      box-shadow:
        0 0 0 5px rgba(255, 230, 0, 0.75),
        0 0 24px rgba(255, 230, 0, 0.95);
      z-index: 30;
    }

    #tooltip {
      position: fixed;
      display: none;
      background: #ffffff;
      color: #111;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      z-index: 100;
      font-size: 16px;
      font-weight: 600;
      pointer-events: none;
      max-width: 360px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .controls {
      position: fixed;
      left: 20px;
      top: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }

    .controls button {
      border: none;
      background: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .controls button:hover {
      background: #f7f7f7;
    }
  </style>
</head>

  const viewer = document.getElementById("viewer");
  const mapLayer = document.getElementById("mapLayer");
  const tooltip = document.getElementById("tooltip");

  let fitScale = 1;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  const MIN_ZOOM = 1;
  const MAX_ZOOM = 4;

  function updateTransform() {
    mapLayer.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  }

  function centerMapAtScale(targetScale) {
    offsetX = (viewer.clientWidth - MAP_WIDTH * targetScale) / 2;
    offsetY = (viewer.clientHeight - VISIBLE_MAP_HEIGHT * targetScale) / 2;
  }

  function fitMap() {
    const scaleX = viewer.clientWidth / MAP_WIDTH;
    const scaleY = viewer.clientHeight / VISIBLE_MAP_HEIGHT;

    fitScale = Math.min(scaleX, scaleY);
    scale = fitScale;

    centerMapAtScale(scale);
    updateTransform();
  }

  function zoomAt(clientX, clientY, zoomFactor) {
    const newScale = Math.max(fitScale * MIN_ZOOM, Math.min(scale * zoomFactor, fitScale * MAX_ZOOM));

    const rect = mapLayer.getBoundingClientRect();
    const worldX = (clientX - rect.left) / scale;
    const worldY = (clientY - rect.top) / scale;

    offsetX = clientX - worldX * newScale;
    offsetY = clientY - worldY * newScale;
    scale = newScale;

    updateTransform();
  }

  function zoomIn() {
    const cx = viewer.clientWidth / 2;
    const cy = viewer.clientHeight / 2;
    zoomAt(cx, cy, 1.2);
  }

  function zoomOut() {
    const cx = viewer.clientWidth / 2;
    const cy = viewer.clientHeight / 2;
    zoomAt(cx, cy, 1 / 1.2);
  }

  function resetView() {
    scale = fitScale;
    centerMapAtScale(scale);
    updateTransform();
  }

  viewer.addEventListener("wheel", function(e) {
    e.preventDefault();

    if (e.deltaY < 0) {
      zoomAt(e.clientX, e.clientY, 1.1);
    } else {
      zoomAt(e.clientX, e.clientY, 1 / 1.1);
    }
  }, { passive: false });

  function addPoints() {
    points.forEach(item => {
      const point = document.createElement("div");
      point.className = `point ${item.shape || "circle"}`;
      point.style.left = item.x + "px";
      point.style.top = item.y + "px";

      point.addEventListener("mousemove", function(e) {
        tooltip.style.display = "block";
        tooltip.innerText = item.name;

        let left = e.clientX + 15;
        let top = e.clientY + 15;

        if (left + tooltip.offsetWidth > window.innerWidth) {
          left = e.clientX - tooltip.offsetWidth - 15;
        }

        if (top + tooltip.offsetHeight > window.innerHeight) {
          top = e.clientY - tooltip.offsetHeight - 15;
        }

        tooltip.style.left = left + "px";
        tooltip.style.top = top + "px";
      });

      point.addEventListener("mouseleave", function() {
        tooltip.style.display = "none";
      });

      mapLayer.appendChild(point);
    });
  }

  addPoints();
  fitMap();

  window.addEventListener("resize", fitMap);
