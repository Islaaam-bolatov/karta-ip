<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Интерактивная карта ИП</title>

  <style>
    body {
      margin: 0;
      touch-action: none;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #f2f2f2;
    }

    #mapLayer {
      position: absolute;
      left: 0;
      top: 0;
      width: 2048px;
      height: 1356px; /* видимая часть карты, нижняя полоса скрыта */
      overflow: hidden;
      transform-origin: 0 0;
    }

    #mapImage {
      width: 2048px;
      height: 1448px;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .point {
      position: absolute;
      background: transparent;
      border: none;
      transform: translate(-50%, -50%);
      cursor: pointer;
      box-sizing: border-box;
      z-index: 10;
    }

    .point.circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .point.square {
      width: 34px;
      height: 34px;
      border-radius: 4px;
    }

    /* ГРПШ скрыты и появляются при наведении на предприятие или на само место */
    .point.grpsh::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid #000;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .point.grpsh.blue::before { background: #2371c7; }
    .point.grpsh.green::before { background: #00a110; }
    .point.grpsh:hover::before,
    .point.grpsh.hl::before { opacity: 1; }

    .point.square { z-index: 9; }
    .point.circle:hover,
    .point.square:hover,
    .point.hl {
      background: rgba(255, 230, 0, 0.22);
      box-shadow:
        0 0 0 5px rgba(255, 230, 0, 0.75),
        0 0 24px rgba(255, 230, 0, 0.95);
      z-index: 30;
    }

    /* короткие названия на карте */
    .lbl {
      position: absolute;
      z-index: 5;
      font: 600 15px/1 Arial, sans-serif;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      color: #1a1a1a;
      text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff;
    }
    .lbl.red { color: #e00000; }
    .lbl.green { color: #0a8a1a; }
    .lbl.a-r { transform: translate(-100%, -50%); }
    .lbl.a-l { transform: translate(0, -50%); }
    .lbl.a-c { transform: translate(-50%, -50%); }

    #tooltip {
      position: fixed;
      display: none;
      background: #ffffff;
      color: #111;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      z-index: 100;
      font-size: 16px;
      font-weight: 600;
      pointer-events: none;
      max-width: 360px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .controls {
      position: fixed;
      left: 20px;
      top: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }

    .controls button {
      border: none;
      background: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .controls button:hover {
      background: #f7f7f7;
    }
  </style>
</head>

<body>

<div id="tooltip"></div>

<div class="controls">
  <button onclick="zoomIn()">+</button>
  <button onclick="zoomOut()">−</button>
  <button onclick="resetView()">Сброс</button>
</div>

  const viewer = document.getElementById("viewer");
  const mapLayer = document.getElementById("mapLayer");
  const tooltip = document.getElementById("tooltip");

  let fitScale = 1;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  const MIN_ZOOM = 1;
  const MAX_ZOOM = 4;

  function updateTransform() {
    mapLayer.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  }

  function centerMapAtScale(targetScale) {
    offsetX = (viewer.clientWidth - MAP_WIDTH * targetScale) / 2;
    offsetY = (viewer.clientHeight - VISIBLE_MAP_HEIGHT * targetScale) / 2;
  }

  function fitMap() {
    const scaleX = viewer.clientWidth / MAP_WIDTH;
    const scaleY = viewer.clientHeight / VISIBLE_MAP_HEIGHT;

    fitScale = Math.min(scaleX, scaleY);
    scale = fitScale;

    centerMapAtScale(scale);
    updateTransform();
  }

  function zoomAt(clientX, clientY, zoomFactor) {
    const newScale = Math.max(fitScale * MIN_ZOOM, Math.min(scale * zoomFactor, fitScale * MAX_ZOOM));

    const rect = mapLayer.getBoundingClientRect();
    const worldX = (clientX - rect.left) / scale;
    const worldY = (clientY - rect.top) / scale;

    offsetX = clientX - worldX * newScale;
    offsetY = clientY - worldY * newScale;
    scale = newScale;

    updateTransform();
  }

  function zoomIn() {
    const cx = viewer.clientWidth / 2;
    const cy = viewer.clientHeight / 2;
    zoomAt(cx, cy, 1.2);
  }

  function zoomOut() {
    const cx = viewer.clientWidth / 2;
    const cy = viewer.clientHeight / 2;
    zoomAt(cx, cy, 1 / 1.2);
  }

  function resetView() {
    scale = fitScale;
    centerMapAtScale(scale);
    updateTransform();
  }

  viewer.addEventListener("wheel", function(e) {
    e.preventDefault();

    if (e.deltaY < 0) {
      zoomAt(e.clientX, e.clientY, 1.1);
    } else {
      zoomAt(e.clientX, e.clientY, 1 / 1.1);
    }
  }, { passive: false });

  function setGroup(g, on) {
    if (!g) return;
    document.querySelectorAll('.point[data-group="' + g + '"]').forEach(el => el.classList.toggle("hl", on));
  }
  function clearGroups() {
    document.querySelectorAll(".point.hl").forEach(el => el.classList.remove("hl"));
  }

  function addPoints() {
    points.forEach(item => {
      const point = document.createElement("div");
      point.className = `point ${item.shape || "circle"}` + (item.kind ? " grpsh " + item.kind : "");
      point.style.left = item.x + "px";
      point.style.top = item.y + "px";

      point.addEventListener("mousemove", function(e) {
        tooltip.style.display = "block";
        tooltip.innerText = item.label || item.name;

        let left = e.clientX + 15;
        let top = e.clientY + 15;

        if (left + tooltip.offsetWidth > window.innerWidth) {
          left = e.clientX - tooltip.offsetWidth - 15;
        }

        if (top + tooltip.offsetHeight > window.innerHeight) {
          top = e.clientY - tooltip.offsetHeight - 15;
        }

        tooltip.style.left = left + "px";
        tooltip.style.top = top + "px";
      });

      point.addEventListener("mouseenter", function() { setGroup(item.g, true); });
      point.addEventListener("mouseleave", function() {
        tooltip.style.display = "none";
        setGroup(item.g, false);
      });

      point.dataset.name = item.label || item.name;
      if (item.g) point.dataset.group = item.g;
      if (item.s) {
        const lbl = document.createElement("div");
        lbl.className = "lbl " + item.c + " a-" + item.a;
        lbl.textContent = item.s;
        lbl.style.left = item.lx + "px";
        lbl.style.top = item.ly + "px";
        mapLayer.appendChild(lbl);
      }
      mapLayer.appendChild(point);
    });
  }


  // ---- перетаскивание и жесты (мышь / палец) ----
  const pointers = new Map();
  let lastDist = 0, moved = false;
  function clampPan() {
    const w = MAP_WIDTH * scale, h = VISIBLE_MAP_HEIGHT * scale;
    offsetX = w <= viewer.clientWidth ? (viewer.clientWidth - w) / 2 : Math.min(0, Math.max(viewer.clientWidth - w, offsetX));
    offsetY = h <= viewer.clientHeight ? (viewer.clientHeight - h) / 2 : Math.min(0, Math.max(viewer.clientHeight - h, offsetY));
  }
  viewer.addEventListener("pointerdown", e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false; lastDist = 0;
  });
  viewer.addEventListener("pointermove", e => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    if (pointers.size === 1) {
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (moved) { offsetX += dx; offsetY += dy; clampPan(); updateTransform(); tooltip.style.display = "none"; }
    }
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastDist) { zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, dist / lastDist); clampPan(); updateTransform(); }
      lastDist = dist; moved = true;
    }
  });
  const endPointer = e => { pointers.delete(e.pointerId); lastDist = 0; };
  viewer.addEventListener("pointerup", endPointer);
  viewer.addEventListener("pointercancel", endPointer);
  // тап по маркеру на телефоне показывает название
  mapLayer.addEventListener("click", e => {
    if (moved) return;
    const el = e.target.closest(".point");
    clearGroups();
    if (!el) { tooltip.style.display = "none"; return; }
    setGroup(el.dataset.group, true);
    tooltip.innerText = el.dataset.name;
    tooltip.style.display = "block";
    tooltip.style.left = Math.max(8, Math.min(e.clientX - tooltip.offsetWidth / 2, window.innerWidth - tooltip.offsetWidth - 8)) + "px";
    tooltip.style.top = Math.max(8, e.clientY - tooltip.offsetHeight - 24) + "px";
  });

  addPoints();
  fitMap();

  window.addEventListener("resize", fitMap);
</script>
